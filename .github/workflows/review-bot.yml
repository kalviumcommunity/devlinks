name: OpenNest Review Bot
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const body = pr.body || '';
            const branch = pr.head.ref || '';

            const linksIssue = /(fix|close|resolve)(s|d)?\s+#\d+/i.test(body) || /#\d+/.test(body);
            const hasWhatWhy = /what|why|change/i.test(body);
            const branchOk = /^(fix|feat|docs|chore)\/.+/.test(branch);

            const lines = [];
            lines.push(branchOk
              ? '- ✅ Branch name follows `type/short-desc`'
              : '- ⚠️ Branch name should look like `fix/1-heading-typo`');
            lines.push(linksIssue
              ? '- ✅ PR links an issue'
              : '- ⚠️ Please link the issue this fixes (e.g. `Fixes #1`)');
            lines.push(hasWhatWhy
              ? '- ✅ Description explains the change'
              : '- ⚠️ Add a short **What & Why** to the description');

            const msg = [
              "👋 Thanks for your pull request! I'm the **OpenNest Review Bot**.",
              "",
              "I read through your PR carefully — here's my pass:",
              ...lines,
              "",
              "Your change actually looks well aligned and reasonable. 👏 But heads up: **this is a training / dummy repository**, so I'm **requesting changes** here rather than merging — the goal is for you to experience the full review loop, not to ship to production.",
              "",
              "**What to do next:** don't worry about \"fixing\" anything specific — this is expected. Feel free to keep experimenting, open more PRs, and practise the workflow.",
              "",
              "> Remember: *changes requested* is a normal, healthy part of open source. Every engineer gets review comments — it's how we ship quality together. Thanks for raising this PR, and keep contributing! 🪺💪"
            ].join('\n');

            await github.rest.pulls.createReview({
              owner, repo, pull_number: pr.number,
              event: 'REQUEST_CHANGES', body: msg
            });
