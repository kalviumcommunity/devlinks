name: 🐛 Bug Report
description: Report a reproducible bug in DevLinks
labels: ["bug", "needs reproduction"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open index.html … 2. …
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence (screenshot / console error)
