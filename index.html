<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevLinks</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- BUG (issue #11): favicon link is missing -->
</head>
<body>
  <nav class="nav">
    <span class="brand">🪺 DevLinks</span>
    <a href="#links">Links</a>
    <a href="#about">About</a>
  </nav>

  <main class="card">
    <!-- BUG (issue #2): image is missing alt text -->
    <img class="avatar" src="assets/avatar.png" />

    <!-- BUG (issue #1): "Wecome" should be "Welcome" -->
    <h1>Wecome to DevLinks</h1>

    <!-- BUG (issue #7): placeholder bio text left in -->
    <p id="bio">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>

    <section id="links" class="links">
      <!-- BUG (issue #3): GitHub URL is broken ("htps") -->
      <a class="btn btn-primary" href="https://github.com/opennest">GitHub</a>
      <a class="btn btn-primary" href="https://twitter.com/opennest">Twitter</a>
      <button id="copy-btn" class="btn btn-primary">Copy profile link</button>
    </section>

    <!-- BUG (issue #4): footer year is outdated -->
    <footer>© 2019 OpenNest · DevLinks</footer>
  </main>
</body>
</html>
