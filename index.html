<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevLinks</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- favicon (inline SVG) to avoid external asset dependency -->
  <link rel="icon" href='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪺</text></svg>' />
</head>
<body>
  <nav class="nav">
    <span class="brand">🪺 DevLinks</span>
    <a href="#links">Links</a>
    <a href="#about">About</a>
  </nav>

  <main class="card">
    <!-- image has alt text for accessibility -->
    <img class="avatar" src="assets/avatar.png" alt="DevLinks avatar" />

    <!-- corrected heading spelling -->
    <h1>Welcome to DevLinks</h1>

    <!-- short descriptive bio -->
    <p id="bio">A curated list of links and profiles for developers — share, copy, and connect.</p>

    <section id="links" class="links">
      <!-- fixed GitHub URL -->
      <a class="btn btn-primary" href="https://github.com/opennest" target="_blank" rel="noopener">GitHub</a>
      <a class="btn btn-primary" href="https://twitter.com/opennest">Twitter</a>
      <button id="copy-btn" class="btn btn-primary">Copy profile link</button>
    </section>

    <!-- updated footer year -->
    <footer>© 2026 OpenNest · DevLinks</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
